name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift-package:
    name: Swift package
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Build package
        run: |
          xcodebuild \
            -scheme JomloCollectionView \
            -destination "platform=iOS Simulator,name=iPhone 16 Pro" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Test package
        run: |
          xcodebuild \
            -scheme JomloCollectionView \
            -destination "platform=iOS Simulator,name=iPhone 16 Pro" \
            CODE_SIGNING_ALLOWED=NO \
            test

  example:
    name: Example app
    runs-on: macos-15

    strategy:
      fail-fast: false
      matrix:
        include:
          - scheme: JomloCV Example iOS
            destination: generic/platform=iOS Simulator
          - scheme: JomloCV Example tvOS
            destination: generic/platform=tvOS Simulator

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build ${{ matrix.scheme }}
        run: |
          xcodebuild \
            -project Example/JomloCollectionViewExample.xcodeproj \
            -scheme "${{ matrix.scheme }}" \
            -destination "${{ matrix.destination }}" \
            CODE_SIGNING_ALLOWED=NO \
            build

  podspec:
    name: CocoaPods podspec
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Lint podspec
        run: |
          pod lib lint JomloCollectionView.podspec \
            --allow-warnings \
            --platforms=ios,tvos \
            --skip-import-validation
